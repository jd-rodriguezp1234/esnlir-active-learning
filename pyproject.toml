[project]
name = "esnlir"
version = "0.1.0"
description = "Esnlir training example"
readme = "README.md"
requires-python = ">=3.10,<4.0"
authors = [{ name = "Johan Rodriguez", email = "jd.rodriguezp1234@uniandes.edu.co" }]
dependencies = [
    "jupyter>=1.1.1,<2.0.0",
    "notebook>=7.4.3,<8.0.0",
    "matplotlib>=3.10.3,<4.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "tqdm>=4.67.1,<5.0.0",
    "transformers>=4.36.0,<5.0.0",
    "scikit-learn>=1.7,<2.0",
    "accelerate>=1.11.0,<2.0.0",
    "tensorboard>=2.20.0,<3.0.0",
    "ipykernel>=7.1.0,<8.0.0",
    "torch>=2.7.1,<3.0.0",
    "pandas>=2.3.0,<3.0.0",
    "numpy>=2.2.6,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["esnlir"]
